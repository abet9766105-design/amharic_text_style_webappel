services:
  - type: web
    name: amharic-text-style
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SITE_NAME
        value: Amharic Text Style
      - key: CONTACT_EMAIL
        sync: false
      - key: ADSENSE_CLIENT
        sync: false
      - key: AD_SLOT_TOP
        sync: false
      - key: AD_SLOT_BOTTOM
        sync: false
